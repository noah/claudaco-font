name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  patcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q patch_claudaco.py
      - run: python patch_claudaco.py --help
